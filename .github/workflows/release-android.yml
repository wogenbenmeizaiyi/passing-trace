name: Release Android

on:
  push:
    branches:
      - codex/media-ai-memory
    paths:
      - .github/workflows/release-android.yml
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name
        required: true
        default: 1.0.6
      version_code:
        description: Android version code (must always increase)
        required: true
        default: "9"
      minimum_supported_version_code:
        description: Versions below this code must update
        required: true
        default: "1"
      notes:
        description: Chinese release notes
        required: true
        default: 固定正式版签名证书，并隔离内测版安装包。

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_VERSION_NAME: ${{ inputs.version_name || '1.0.6' }}
      RELEASE_VERSION_CODE: ${{ inputs.version_code || '9' }}
      RELEASE_MINIMUM_SUPPORTED_VERSION_CODE: ${{ inputs.minimum_supported_version_code || '1' }}
      RELEASE_NOTES: ${{ inputs.notes || '固定正式版签名证书，并隔离内测版安装包。' }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_REGION: ${{ vars.S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/passingtrace-mobile/android/app/release.keystore
      ANDROID_SIGNING_STORE_PASSWORD: android
      ANDROID_SIGNING_KEY_ALIAS: androiddebugkey
      ANDROID_SIGNING_KEY_PASSWORD: android
      ANDROID_SIGNING_SHA256: 99706958760D9FEDBF388DA327FB7159B9F233EC89E394A44188C9C32C509F78
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Restore Android signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE"
          chmod 600 "$ANDROID_SIGNING_STORE_FILE"

      - name: Verify release keystore certificate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(keytool -exportcert \
            -keystore "$ANDROID_SIGNING_STORE_FILE" \
            -storepass "$ANDROID_SIGNING_STORE_PASSWORD" \
            -alias "$ANDROID_SIGNING_KEY_ALIAS" \
            | sha256sum \
            | awk '{print toupper($1)}')"
          if [ "$actual" != "$ANDROID_SIGNING_SHA256" ]; then
            echo "::error::Unexpected release keystore certificate: $actual"
            exit 1
          fi

      - name: Configure Android and restore packages
        working-directory: passingtrace-mobile
        shell: bash
        env:
          AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
        run: |
          set -euo pipefail
          flutter pub get
          printf '\nAMAP_ANDROID_KEY=%s\n' "$AMAP_ANDROID_KEY" >> android/local.properties

      - name: Test
        working-directory: passingtrace-mobile
        run: flutter test

      - name: Build production APK
        working-directory: passingtrace-mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --flavor production \
            --build-name "$RELEASE_VERSION_NAME" \
            --build-number "$RELEASE_VERSION_CODE" \
            --dart-define PASSINGTRACE_CHANNEL=production \
            --dart-define PASSINGTRACE_IDENTITY_URL=https://auth.passingtrace.com \
            --dart-define PASSINGTRACE_EVENTS_API_URL=https://passingtrace.com

      - name: Verify production signing certificate
        working-directory: passingtrace-mobile
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-production-release.apk'
          signer_output="$($ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner \
            verify --print-certs "$apk" 2>&1)"
          printf '%s\n' "$signer_output"
          actual="$(printf '%s\n' "$signer_output" \
            | awk -F ': ' '/certificate SHA-256 digest/ {print toupper($NF); exit}' \
            | tr -d '\r')"
          if [ "$actual" != "$ANDROID_SIGNING_SHA256" ]; then
            echo "::error::Unexpected Android signing certificate: $actual"
            exit 1
          fi

      - name: Create release manifest
        shell: bash
        env:
          VERSION_NAME: ${{ env.RELEASE_VERSION_NAME }}
          VERSION_CODE: ${{ env.RELEASE_VERSION_CODE }}
          MINIMUM_SUPPORTED_VERSION_CODE: ${{ env.RELEASE_MINIMUM_SUPPORTED_VERSION_CODE }}
        run: |
          set -euo pipefail
          install -d release
          apk='passingtrace-mobile/build/app/outputs/flutter-apk/app-production-release.apk'
          object_key="releases/android/PassingTrace-${VERSION_NAME}-${VERSION_CODE}.apk"
          cp "$apk" release/PassingTrace.apk
          export APK_OBJECT_KEY="$object_key"
          export APK_SHA256="$(sha256sum "$apk" | awk '{print $1}')"
          export APK_SIZE="$(stat -c '%s' "$apk")"
          python3 - <<'PY'
          import datetime
          import json
          import os

          manifest = {
              "versionName": os.environ["VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "objectKey": os.environ["APK_OBJECT_KEY"],
              "sha256": os.environ["APK_SHA256"],
              "size": int(os.environ["APK_SIZE"]),
              "notes": os.environ["RELEASE_NOTES"],
              "minimumSupportedVersionCode": int(os.environ["MINIMUM_SUPPORTED_VERSION_CODE"]),
          }
          with open("release/latest.json", "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, ensure_ascii=False, separators=(",", ":"))
          PY
          printf '%s' "$object_key" > release/object-key.txt

      - name: Upload APK and publish manifest to Rainyun S3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet boto3
          python3 - <<'PY'
          import os
          import boto3
          from botocore.config import Config

          with open("release/object-key.txt", encoding="utf-8") as stream:
              object_key = stream.read()
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT"],
              region_name=os.environ.get("S3_REGION") or "us-east-1",
              aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
              config=Config(s3={"addressing_style": "virtual"}),
          )
          client.upload_file(
              "release/PassingTrace.apk",
              os.environ["S3_BUCKET"],
              object_key,
              ExtraArgs={"ContentType": "application/vnd.android.package-archive"},
          )
          client.upload_file(
              "release/latest.json",
              os.environ["S3_BUCKET"],
              "releases/android/latest.json",
              ExtraArgs={"ContentType": "application/json; charset=utf-8", "CacheControl": "no-cache"},
          )
          PY

      - name: Keep CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassingTrace-${{ env.RELEASE_VERSION_NAME }}-${{ env.RELEASE_VERSION_CODE }}-production
          path: |
            release/PassingTrace.apk
            release/latest.json
          if-no-files-found: error
          retention-days: 30
