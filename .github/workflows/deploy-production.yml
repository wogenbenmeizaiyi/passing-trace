name: Deploy production

on:
  push:
    branches:
      - codex/media-ai-memory
  workflow_dispatch:

concurrency:
  group: passingtrace-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/wogenbenmeizaiyi

jobs:
  build-and-push:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity
            dockerfile: deploy/Dockerfile.identity
          - name: events
            dockerfile: deploy/Dockerfile.events
          - name: worker
            dockerfile: deploy/Dockerfile.worker
          - name: caddy
            dockerfile: deploy/Dockerfile.caddy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/passingtrace-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            VITE_IDENTITY_AUTHORITY=https://auth.passingtrace.com
            VITE_EVENTS_API_BASE_URL=https://passingtrace.com

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://passingtrace.com
    env:
      DEPLOY_HOST: 154.36.164.76
      DEPLOY_USER: weiyn
      DEPLOY_PATH: /home/weiyn/projects/passing-trace
      EXPECTED_HOST_FINGERPRINT: SHA256:HSTFK3KSm+b/+X9G1UQwgcclC13T6EcQeUEJVFS5+5w
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}' > ~/.ssh/passingtrace_ci
          chmod 600 ~/.ssh/passingtrace_ci
          host_key="$(ssh-keyscan -t ed25519 "$DEPLOY_HOST" 2>/dev/null)"
          actual_fingerprint="$(printf '%s\n' "$host_key" | ssh-keygen -lf - | awk '{print $2}')"
          test "$actual_fingerprint" = "$EXPECTED_HOST_FINGERPRINT"
          printf '%s\n' "$host_key" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare production environment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > passingtrace.env <<EOF
          WEB_DOMAIN=passingtrace.com
          AUTH_DOMAIN=auth.passingtrace.com
          FILES_DOMAIN=files.passingtrace.com
          IDENTITY_IMAGE=${IMAGE_NAMESPACE}/passingtrace-identity:${GITHUB_SHA}
          EVENTS_IMAGE=${IMAGE_NAMESPACE}/passingtrace-events:${GITHUB_SHA}
          WORKER_IMAGE=${IMAGE_NAMESPACE}/passingtrace-worker:${GITHUB_SHA}
          CADDY_IMAGE=${IMAGE_NAMESPACE}/passingtrace-caddy:${GITHUB_SHA}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          MINIO_ACCESS_KEY=passingtrace-production
          MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
          CERTIFICATE_PASSWORD=${{ secrets.CERTIFICATE_PASSWORD }}
          REGISTRATION_BOOTSTRAP_CODE=${{ secrets.REGISTRATION_BOOTSTRAP_CODE }}
          QWEN_API_KEY=${{ secrets.QWEN_API_KEY }}
          AMAP_WEB_SERVICE_KEY=${{ secrets.AMAP_WEB_SERVICE_KEY }}
          EOF

      - name: Update server
        shell: bash
        run: |
          set -euo pipefail
          ssh_args=(-i ~/.ssh/passingtrace_ci -o IdentitiesOnly=yes)
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -eu
          cd "$1"
          git fetch origin codex/media-ai-memory
          git checkout codex/media-ai-memory
          git pull --ff-only origin codex/media-ai-memory
          REMOTE
          scp "${ssh_args[@]}" passingtrace.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/.env.next"
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            docker login ghcr.io --username '${{ github.actor }}' --password-stdin >/dev/null
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -eu
          cd "$1"
          chmod 600 deploy/.env.next
          mv deploy/.env.next deploy/.env
          docker compose --env-file deploy/.env -f deploy/compose.yml --profile setup run --rm certificates
          docker compose --env-file deploy/.env -f deploy/compose.yml pull
          docker compose --env-file deploy/.env -f deploy/compose.yml up -d --no-build --remove-orphans
          docker compose --env-file deploy/.env -f deploy/compose.yml ps
          REMOTE
